# Render Blueprint — Family Case Review (go_live_readiness §2 decision).
# Deploy: Render dashboard → Blueprints → New Blueprint Instance → this repo.
# Secrets marked sync:false are prompted at first deploy — set them from the
# rotated values (readiness §5), never the dev .env.
#
# MANUAL STEPS the blueprint cannot do (run once after first deploy):
#   1. Postgres shell:  CREATE EXTENSION IF NOT EXISTS vector;
#   2. Create the RLS role (readiness P0-4):
#        CREATE ROLE hg_app LOGIN PASSWORD '<HG_APP_PASSWORD value>';
#        GRANT USAGE ON SCHEMA public TO hg_app;
#        GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO hg_app;
#        ALTER DEFAULT PRIVILEGES IN SCHEMA public
#          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO hg_app;
#   3. Custom domains: www → web service, api → api service.
#   4. Stripe live webhook → https://api.<domain>/webhooks/stripe.

previewsEnabled: false

databases:
  - name: hg-postgres
    region: ohio # MUST match the services — internal hostnames are region-scoped
    plan: basic-1gb # includes point-in-time recovery — the §11a.2 bound
    postgresMajorVersion: "16"
    databaseName: familycasereview
    ipAllowList: [] # private network only

services:
  - type: redis
    name: hg-redis
    region: ohio
    plan: starter
    maxmemoryPolicy: noeviction # BullMQ jobs must never be evicted
    ipAllowList: []

  - type: pserv # private service — clamd is reachable only inside the network
    name: clamav
    region: ohio
    runtime: image
    image:
      url: docker.io/clamav/clamav:stable
    plan: standard # clamd + signatures need ~2GB RAM

  - type: web
    name: api
    runtime: node
    plan: standard # upgraded 2026-09-06 (2 GB): large records OOM'd on starter
    region: ohio
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @hg/database exec prisma generate && corepack pnpm --filter api build
    preDeployCommand: corepack pnpm --filter @hg/database db:migrate:deploy
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    # A deploy restarts the api and KILLS in-flight analysis runs (2026-09-11:
    # three documentation pushes reset a live Fable run three times). Only
    # changes that can reach this service's build trigger a deploy.
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - .github/**
        - apps/web/**
        - test-fixtures/**
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: hg-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: hg-redis, property: connectionString }
      - key: CLAMD_HOST
        fromService: { type: pserv, name: clamav, property: host }
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://www.snotnoselegal.com
      # Analysis engine: Fable 5.1 (PO decision 2026-09-11 — recall over cost; the
      # Gary/Brian comparisons found ~50% more issues with better verbatim quotes).
      - key: ANALYSIS_MODEL
        value: claude-fable-5-1
      - key: ANALYSIS_SAMPLES
        value: "2"
      - key: ANALYSIS_BATCH
        value: "1"
      - key: ANALYSIS_BATCH_MAX_RECORD_TOKENS
        value: "400000"
      # Cost-telemetry rates follow the engine (Fable 5.1: $10 in / $50 out per MTok).
      - key: MODEL_USD_PER_MTOK_IN
        value: "10"
      - key: MODEL_USD_PER_MTOK_OUT
        value: "50"
      - key: DOC_CLASSIFIER_USD_FACTOR
        value: "0.1" # Haiku $1 vs Fable $10
      - key: MODEL_CACHE_READ_MULT
        value: "0.025" # Fable 5.1 cache hits are 0.025× base (Opus/Sonnet: 0.1)
      - key: ANALYSIS_CACHE_PREWARM
        value: "1" # 1-token live request writes the record to a 1h cache before each batch (2026-09-11)
      - key: TEXTRACT_USD_PER_1K_PAGES
        value: "1.5"
      - { key: HG_APP_PASSWORD, sync: false }
      - { key: NEXTAUTH_SECRET, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      # Memory safety (2026-09-06): every queue worker runs inside this one
      # process. Cap Node's heap below the plan's RAM so the process trims
      # itself instead of being OOM-killed mid-document, and bound how many
      # documents parse at once. Values track the plan above — standard
      # (2 GB): 1536 / 2 / 2 / 1. On starter (512 MB) use 400 / 1 / 1 / 1.
      - { key: NODE_OPTIONS, value: --max-old-space-size=1536 }
      - { key: INGESTION_CONCURRENCY, value: "2" }
      - { key: ANALYSIS_CONCURRENCY, value: "2" }
      - { key: ZIP_CONCURRENCY, value: "1" }
      - { key: AWS_ACCESS_KEY_ID, sync: false }
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }
      - { key: AWS_REGION, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: EVAL_CORPUS_BUCKET, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      # Ingest-only key (a DSN can send events, never read them) — kept in the
      # blueprint so a sync sets it instead of dropping it (lost twice, 2026-09).
      - key: SENTRY_DSN
        value: https://2288886c2a2123a393bb7e8e29c8f008@o4512005642911744.ingest.us.sentry.io/4512005695012864
      - { key: POSTHOG_API_KEY, sync: false }

  - type: web
    name: web
    runtime: node
    plan: starter
    region: ohio
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @hg/database exec prisma generate && corepack pnpm --filter web build
    startCommand: corepack pnpm --filter web start
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - .github/**
        - apps/api/**
        - test-fixtures/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://api.snotnoselegal.com
      - key: NEXTAUTH_URL
        value: https://www.snotnoselegal.com
      - { key: NEXTAUTH_SECRET, sync: false }
      # NextAuth's authorize() and session callbacks query Prisma FROM the web
      # server (not through the api) — without this every sign-in fails with
      # 'ServiceUnavailable' (lost in the Sep-1 blueprint re-apply, found 09-02).
      - key: DATABASE_URL
        fromDatabase: { name: hg-postgres, property: connectionString }
      - { key: COOKIE_DOMAIN, value: .snotnoselegal.com }
      - { key: NEXT_PUBLIC_POSTHOG_KEY, sync: false }
