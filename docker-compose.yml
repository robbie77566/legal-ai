version: '3.8'

services:
  postgres:
    restart: unless-stopped
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: legal_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"

  neo4j:
    restart: unless-stopped
    image: neo4j:latest
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j_data:/data

  # ENG-4 malware scanning: set CLAMD_HOST=localhost (port 3310) in .env to
  # activate the scan gate; without it, dev uploads log an unscanned warning.
  # Opt-in profile: `docker compose --profile scan up -d clamav` (the virus-db
  # download is ~300MB and unneeded for most dev work).
  clamav:
    profiles: ["scan"]
    restart: unless-stopped
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  postgres_data:
  neo4j_data:
  clamav_data:
