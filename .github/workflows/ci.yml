name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habeasgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/habeasgraph_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        # No `version:` here — the action reads package.json's packageManager
        # pin (pnpm@11.1.0). Setting both makes action-setup@v4 refuse with
        # "Multiple versions of pnpm specified", which failed EVERY run from
        # the Aug-31 Render corepack pin until 2026-09-02.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (critical only blocks)
        run: pnpm audit --audit-level critical

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Apply DB migrations (test)
        # migrate deploy, NOT db push: push syncs the Prisma schema but skips
        # the raw SQL migrations that create the RLS policies, the append-only
        # trigger, and the hg_app role — the integration tests verify those.
        run: |
          pnpm --filter @hg/database db:generate
          pnpm --filter @hg/database db:migrate:deploy

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Unit & integration tests
        # vitest workspace directly — `turbo test` matched no package scripts
        # and silently ran nothing. Includes the live-Postgres RLS suite.
        run: pnpm exec vitest run

      - name: E2E tests
        run: pnpm --filter web exec playwright test
        env:
          CI: true
