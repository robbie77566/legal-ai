# Render Blueprint — STAGING (snotnoselegal-staging instance, linked branch `main`,
# Blueprint Path render.staging.yaml). Same shape as render.yaml, separate
# resources, separate secrets, seeded data only (db:seed:staging) — never a copy
# of production. Keep every service's variable set identical to its production
# twin in render.yaml; scripts/env-drift.cjs fails CI when they differ.
#
# MANUAL STEPS (once, after the first sync):
#   S1. Postgres shell on hg-postgres-staging: CREATE EXTENSION IF NOT EXISTS vector;
#       then the hg_app role and grants exactly as render.yaml step 2.
#   S2. Custom domains: staging.snotnoselegal.com → web-staging,
#       api.staging.snotnoselegal.com → api-staging. COOKIE_DOMAIN is
#       .staging.snotnoselegal.com and NEXTAUTH_SECRET differs from production,
#       so a staging session never shares or verifies against the production jar.
#   S3. Stripe TEST-mode webhook → https://api.staging.snotnoselegal.com/webhooks/stripe.
#   S4. Secrets are a separate set: Stripe test keys, a separate Anthropic key
#       (cost tagging), a separate Sentry project DSN, staging S3 buckets with
#       their own IAM user, a Resend key used only behind the recipient
#       allowlist. Never the production values.
#   S5. Deploy hook → the GitHub Action that runs the Playwright suite against
#       https://staging.snotnoselegal.com after each deploy.

previewsEnabled: false

databases:
  - name: hg-postgres-staging
    region: ohio # must match the services — internal hostnames are region-scoped
    plan: 0.1c-256mb # smallest documented id; PITR is a production guarantee, not a staging need
    postgresMajorVersion: "16"
    databaseName: familycasereview_staging
    ipAllowList: []

services:
  - type: redis
    name: hg-redis-staging
    region: ohio
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: pserv
    name: clamav-staging
    region: ohio
    runtime: image
    image:
      url: docker.io/clamav/clamav:stable
    plan: standard # clamd needs ~2GB even on staging; EICAR quarantine is on the release checklist

  - type: web
    name: api-staging
    runtime: node
    branch: main
    plan: standard # same memory ceiling as production so OOM behaviour matches
    region: ohio
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @hg/database exec prisma generate && corepack pnpm --filter api build
    preDeployCommand: corepack pnpm --filter @hg/database db:migrate:deploy
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - .github/**
        - apps/web/**
        - test-fixtures/**
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: hg-postgres-staging, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: hg-redis-staging, property: connectionString }
      - key: CLAMD_HOST
        fromService: { type: pserv, name: clamav-staging, property: host }
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://staging.snotnoselegal.com
      # Engine parity with production for eval and cost runs; switch the model
      # in the dashboard for cheap routine flow tests.
      - key: ANALYSIS_MODEL
        value: claude-fable-5-1
      - key: ANALYSIS_PROMPT_SET
        value: v2
      - key: ANALYSIS_SAMPLES
        value: "2"
      - key: ANALYSIS_BATCH
        value: "1"
      - key: ANALYSIS_BATCH_MAX_RECORD_TOKENS
        value: "400000"
      - key: MODEL_USD_PER_MTOK_IN
        value: "10"
      - key: MODEL_USD_PER_MTOK_OUT
        value: "50"
      - key: DOC_CLASSIFIER_USD_FACTOR
        value: "0.1"
      - key: MODEL_CACHE_READ_MULT
        value: "0.025"
      - key: ANALYSIS_CACHE_PREWARM
        value: "1"
      - key: TEXTRACT_USD_PER_1K_PAGES
        value: "1.5"
      - { key: HG_APP_PASSWORD, sync: false }
      - { key: NEXTAUTH_SECRET, sync: false } # distinct from production: a staging session must not verify on prod
      - { key: ANTHROPIC_API_KEY, sync: false } # separate key for cost tagging
      - { key: NODE_OPTIONS, value: --max-old-space-size=1536 }
      - { key: INGESTION_CONCURRENCY, value: "2" }
      - { key: ANALYSIS_CONCURRENCY, value: "2" }
      - { key: ZIP_CONCURRENCY, value: "1" }
      - { key: AWS_ACCESS_KEY_ID, sync: false } # staging IAM user, staging buckets only
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }
      - { key: AWS_REGION, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: EVAL_CORPUS_BUCKET, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false } # TEST mode
      - { key: STRIPE_WEBHOOK_SECRET, sync: false } # the test-mode endpoint's secret
      - { key: RESEND_API_KEY, sync: false } # only ever used behind the recipient allowlist
      - { key: EMAIL_ALLOWLIST, value: "@example.com,@snotnoselegal.com" } # staging only: anyone else is dropped and logged (packages/email)
      - { key: SENTRY_DSN, sync: false } # separate Sentry project
      - { key: POSTHOG_API_KEY, sync: false } # separate PostHog project

  - type: web
    name: web-staging
    runtime: node
    branch: main
    plan: starter
    region: ohio
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @hg/database exec prisma generate && corepack pnpm --filter web build
    startCommand: corepack pnpm --filter web start
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - .github/**
        - apps/api/**
        - test-fixtures/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://api.staging.snotnoselegal.com
      - key: NEXTAUTH_URL
        value: https://staging.snotnoselegal.com
      - { key: NEXTAUTH_SECRET, sync: false } # same value as api-staging, different from production
      - key: DATABASE_URL
        fromDatabase: { name: hg-postgres-staging, property: connectionString }
      - { key: COOKIE_DOMAIN, value: .staging.snotnoselegal.com } # its own jar, never .snotnoselegal.com
      - { key: NEXT_PUBLIC_POSTHOG_KEY, sync: false }
